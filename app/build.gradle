apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {

  defaultConfig {
    namespace 'com.michaldrabik.muzeipixelartextension'

    minSdkVersion 21
    targetSdkVersion 34
    compileSdk 34

    versionCode 16
    versionName "1.3.0"

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    def authorityValue = "com.michaldrabik.muzeipixelartextensionauthority"
    manifestPlaceholders = [
      pixelArtAuthority: authorityValue
    ]
    buildConfigField "String", "PIXELART_AUTHORITY", "\"${authorityValue}\""
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  signingConfigs {
    config {
      keyAlias getLocalProperty("keystore.properties", "keyAlias")
      keyPassword getLocalProperty("keystore.properties", "keyPassword")
      storeFile file(getLocalProperty("keystore.properties", "storeFile"))
      storePassword getLocalProperty("keystore.properties", "storePassword")
    }
  }

  buildTypes {
    debug {
      minifyEnabled false
      shrinkResources false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      signingConfig signingConfigs.config
    }
  }

  flavorDimensions = ["stage"]
  productFlavors {
    development {
      dimension "stage"
      applicationIdSuffix ".dev"
      versionNameSuffix "-dev"
    }
    production {
      dimension "stage"
    }
  }
  buildFeatures {
    buildConfig true
  }
}

dependencies {
  implementation fileTree(include: ['*.jar'], dir: 'libs')

  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.work:work-runtime-ktx:2.9.0"

  implementation "com.squareup.retrofit2:retrofit:2.11.0"
  implementation "com.squareup.retrofit2:converter-moshi:2.11.0"
  implementation "com.squareup.moshi:moshi-kotlin:1.15.1"
  implementation "com.squareup.okhttp3:logging-interceptor:4.11.0"

  implementation "com.google.android.apps.muzei:muzei-api:3.4.2"
  implementation "com.google.firebase:firebase-crashlytics:19.0.2"
  implementation "com.google.firebase:firebase-analytics:22.0.2"

  testImplementation "junit:junit:4.13.2"
}

def getLocalProperty(String fileName, String propertyName) {
  def propsFile = rootProject.file(fileName)
  if (propsFile.exists()) {
    def props = new Properties()
    props.load(new FileInputStream(propsFile))
    return props[propertyName]
  } else {
    return ""
  }
}